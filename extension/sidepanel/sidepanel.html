<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="sidepanel.css" />
  <title>JobPilot</title>
</head>
<body>
  <!-- Lucide icons (ISC). SVG, never emoji. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></symbol>
    <symbol id="i-zap" viewBox="0 0 24 24"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M16 13H8M16 17H8M10 9H8"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-scissors" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 12h.01M3 18h.01M3 6h.01M8 12h13M8 18h13M8 6h13"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
  </svg>

  <header class="head">
    <svg class="logo" viewBox="0 0 40 40" aria-label="JobPilot"><rect width="40" height="40" rx="11"/><g stroke-width="4.4" stroke-linecap="round" fill="none"><path d="M25.5 11.5 V22 a6 6 0 0 1 -12 0"/><path d="M18.5 11.5 H27.5"/></g></svg>
    <div class="head-txt">
      <div class="name">JobPilot</div>
      <div class="sub" id="conn"><span class="dot"></span>checking…</div>
    </div>
    <label class="switch" title="Turn JobPilot on or off on every page">
      <input type="checkbox" id="power" checked aria-label="JobPilot on this browser" />
      <span class="slider"></span>
    </label>
  </header>

  <div class="actions">
    <button class="btn primary" id="review" title="Scan the form, show every proposed answer for editing, fill only when you approve">
      <svg class="i"><use href="#i-scan"/></svg>Scan &amp; review, then fill
    </button>
    <div class="actions-row">
      <button class="btn sm" id="fillnow" title="Same answers as Scan &amp; review, applied straight away"><svg class="i"><use href="#i-zap"/></svg>Fill now</button>
      <button class="btn sm" id="resume" title="Choose and attach a résumé"><svg class="i"><use href="#i-clip"/></svg>Résumé</button>
    </div>
    <div class="actions-row">
      <button class="btn sm" id="cover" title="Write and attach a cover letter"><svg class="i"><use href="#i-file"/></svg>Cover</button>
      <button class="btn sm" id="save" title="Save this listing to your tracker"><svg class="i"><use href="#i-bookmark"/></svg>Save job</button>
      <button class="btn sm" id="tailor" title="Tailor your résumé to this job description"><svg class="i"><use href="#i-scissors"/></svg>Tailor</button>
    </div>
    <div class="actions-row">
      <button class="btn sm" id="queue" title="Jobs Auto Apply queued: open each, I fill, you submit"><svg class="i"><use href="#i-list"/></svg>Auto apply queue</button>
    </div>
  </div>

  <div class="chat-head"><svg class="i"><use href="#i-chat"/></svg> Copilot</div>
  <div class="chat" id="chat">
    <div class="msg ai">Ask me to fill a field or answer a question. Try:
      <div class="hints">
        <button class="hint">fill current location with Bengaluru</button>
        <button class="hint">answer: exposure to PyTorch?</button>
        <button class="hint">fill notice period with 30 days</button>
      </div>
    </div>
  </div>

  <div class="composer">
    <textarea id="input" rows="1" autocomplete="off" placeholder="Type an instruction…" aria-label="Instruction"></textarea>
    <button id="send" title="Send (Enter)" aria-label="Send">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13" /><path d="M22 2 15 22l-4-9-9-4Z" /></svg>
    </button>
  </div>

  <footer class="foot">
    <a id="opts" href="#"><svg class="i"><use href="#i-gear"/></svg>Options</a>
    <span class="hintline">Enter to send · Shift+Enter for a new line</span>
  </footer>
  <script src="sidepanel.js"></script>
</body>
</html>
