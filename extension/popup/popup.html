<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>JobPilot</title>
</head>
<body>
  <!-- Lucide icons (ISC). SVG, never emoji: they theme with the text and render the same everywhere. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-zap" viewBox="0 0 24 24"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4M22 5h-4"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M16 13H8M16 17H8M10 9H8"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-scissors" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
  </svg>

  <header class="head">
    <!-- The JobPilot "J" mark, coloured from the theme's primary pair. -->
    <svg class="logo" viewBox="0 0 40 40" aria-label="JobPilot"><rect width="40" height="40" rx="11"/><g stroke-width="4.4" stroke-linecap="round" fill="none"><path d="M25.5 11.5 V22 a6 6 0 0 1 -12 0"/><path d="M18.5 11.5 H27.5"/></g></svg>
    <div class="headtext">
      <div class="name">JobPilot</div>
      <div class="sub" id="conn"><span class="dot"></span>checking…</div>
    </div>
    <label class="switch" title="Turn JobPilot on or off on every page">
      <input type="checkbox" id="power" checked aria-label="JobPilot on this browser" />
      <span class="slider"></span>
    </label>
  </header>

  <div class="profile" id="profile">
    <div class="muted">Loading profile…</div>
  </div>

  <div class="actions" id="actions">
    <button class="btn primary big" id="fill">
      <span class="bi"><svg class="i"><use href="#i-zap"/></svg></span><span class="bt">Fill this form<small>One pass. You review and submit.</small></span>
    </button>

    <div class="grid">
      <button class="btn" id="answer"><span class="bi"><svg class="i"><use href="#i-sparkles"/></svg></span><span class="bt">AI answers</span></button>
      <button class="btn" id="resume"><span class="bi"><svg class="i"><use href="#i-clip"/></svg></span><span class="bt">Résumé…</span></button>
      <button class="btn" id="cover"><span class="bi"><svg class="i"><use href="#i-file"/></svg></span><span class="bt">Cover letter</span></button>
      <button class="btn" id="save"><span class="bi"><svg class="i"><use href="#i-bookmark"/></svg></span><span class="bt">Save listing</span></button>
    </div>

    <button class="btn" id="tailor">
      <span class="bi"><svg class="i"><use href="#i-scissors"/></svg></span><span class="bt">Tailor résumé to this job<small>Copies the job description into an AI-tailored copy</small></span>
    </button>
  </div>

  <!-- résumé picker (hidden until Résumé… is clicked) -->
  <div class="picker" id="picker" hidden>
    <div class="picker-head">
      <span>Which résumé?</span>
      <button class="linkbtn" id="pickerClose" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div class="picker-list" id="pickerList"></div>
    <div class="picker-foot">Manage them in the dashboard under Documents → Résumés</div>
  </div>

  <div class="status" id="status" role="status"></div>
  <div class="report" id="report"></div>

  <footer class="foot">
    <button class="linkbtn" id="refresh"><svg class="i"><use href="#i-refresh"/></svg>Refresh profile</button>
    <span class="dotsep">·</span>
    <button class="linkbtn" id="opts"><svg class="i"><use href="#i-gear"/></svg>Options</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
