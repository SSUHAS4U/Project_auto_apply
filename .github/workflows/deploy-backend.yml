name: Build & publish backend image

# Builds the Spring Boot backend into a Docker image on GitHub's free runners (the 1 GB
# VM is too small to build it) and publishes it to GitHub Container Registry. The VM then
# just pulls + runs this image. No secrets are baked in — they live in the VM's .env only.

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/ssuhas4u/jobpilot-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # After the new image is published, SSH into the free GCP VM and roll it out.
  # Requires repo secrets: VM_HOST (the VM's external IP), VM_USER, VM_SSH_KEY (private key).
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Roll out on the VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd ~/jobpilot
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker image prune -f
            echo "Containers: $(sudo docker compose ps --format '{{.Name}} {{.Status}}')"

            # VERIFY BY THE ARTEFACT, NOT THE STATUS.
            #
            # This step used to end at the line above — it echoed "Up 8 seconds" and reported
            # success. Container uptime says the process was started, NOT that the application
            # is serving: a Spring context that dies on a bad migration leaves a container that
            # is technically up while every request 502s. On 2026-09-19 that produced a green
            # deploy over a backend that was down, and the only way to see the cause was to
            # add this step. A deploy that cannot fail is not a deploy check.
            echo "Waiting for /health to actually answer…"
            ok=0
            for i in $(seq 1 30); do
              code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:8080/health || echo 000)
              echo "  [$i] /health -> $code"
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 5
            done

            if [ "$ok" != "1" ]; then
              echo "::error::backend did not serve /health within 150s — dumping logs"
              echo "----------------------------- backend logs -----------------------------"
              sudo docker compose logs --tail 200 backend || sudo docker compose logs --tail 200
              echo "------------------------------------------------------------------------"
              exit 1
            fi
            echo "✅ backend is serving"
