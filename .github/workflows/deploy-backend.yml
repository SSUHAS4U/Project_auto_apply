name: Build & publish backend image

# Builds the Spring Boot backend into a Docker image on GitHub's free runners (the 1 GB
# VM is too small to build it) and publishes it to GitHub Container Registry. The VM then
# just pulls + runs this image. No secrets are baked in — they live in the VM's .env only.

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/ssuhas4u/jobpilot-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # After the new image is published, SSH into the free GCP VM and roll it out.
  # Requires repo secrets: VM_HOST (the VM's external IP), VM_USER, VM_SSH_KEY (private key).
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Roll out on the VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            COMPOSE_DIR=~/jobpilot

            # WHICH FILE DOES COMPOSE ACTUALLY READ? Ask the compose file, do not assume.
            #
            # The first version of this hardcoded /opt/jobpilot/.env, which is the path the
            # application's own error messages had been printing for months. It is wrong:
            # compose declares `env_file: .env`, resolved RELATIVE TO THE COMPOSE FILE, so the
            # real path is ~/jobpilot/.env. Everything below writes secrets the backend now
            # refuses to start without, so writing them to a file nobody loads would have
            # turned this safeguard into the outage it exists to prevent.
            #
            # Deriving it means the next person who moves the file gets a working deploy
            # instead of a confident wrong answer.
            ENVREL=$(sudo grep -m1 -oE '^[[:space:]]*env_file:[[:space:]]*\S+' \
                       "$COMPOSE_DIR/docker-compose.yml" | awk '{print $2}' || true)
            if [ -z "$ENVREL" ]; then
              echo "::error::No env_file declared in $COMPOSE_DIR/docker-compose.yml, so there is"
              echo "::error::nowhere to put the secrets the backend requires. Nothing was changed."
              sudo grep -n -B2 -A4 'env_file' "$COMPOSE_DIR/docker-compose.yml" || true
              exit 1
            fi
            case "$ENVREL" in
              /*) ENVFILE="$ENVREL" ;;
              *)  ENVFILE="$COMPOSE_DIR/$ENVREL" ;;
            esac
            echo "compose loads its environment from: $ENVFILE"
            sudo touch "$ENVFILE"

            # ---- SECRETS BOOTSTRAP -------------------------------------------------------
            #
            # Until 2026-09-19 neither of these was set, so the backend fell back to defaults
            # published in this PUBLIC repository: every session was signed with a key anyone
            # could read, and every stored document was encrypted under a key derived from it.
            # Confirmed live, not theorised.
            #
            # ORDER IS LOAD-BEARING. The document key is pinned FIRST, to the value the stored
            # documents were actually encrypted under. Rotating the JWT secret first would
            # change what DocumentCrypto falls back to and silently destroy every résumé and
            # certificate on the instance — AES-GCM would fail authentication, surfacing as
            # "download broken" rather than as anything connected to a secret rotation.
            #
            # Both writes are idempotent: an existing value is never overwritten, so this is
            # safe on every deploy and does not re-key anything that is already correct.

            # 1. Pin the document key to the historical value, preserving decryptability.
            #    This key is WEAK — it is in the repository — but it is the key the data is
            #    under, and keeping data readable comes before improving the key. Re-keying is
            #    a migration (decrypt-with-old, encrypt-with-new), not a config change.
            if ! sudo grep -q '^JOBPILOT_DOC_KEY=' "$ENVFILE"; then
              echo 'JOBPILOT_DOC_KEY=change-me-jobpilot-dev-jwt-secret' | sudo tee -a "$ENVFILE" >/dev/null
              echo "bootstrap: pinned JOBPILOT_DOC_KEY to the historical key (documents stay readable)"
            fi

            # 2. NOW rotate the session key. Generated on the host, never printed, never in CI
            #    logs and never in this repository. Invalidates existing sessions, which is the
            #    point: every one of them was signed with a published key.
            if ! sudo grep -q '^JOBPILOT_JWT_SECRET=' "$ENVFILE"; then
              printf 'JOBPILOT_JWT_SECRET=%s\n' "$(openssl rand -base64 48)" | sudo tee -a "$ENVFILE" >/dev/null
              echo "bootstrap: generated a strong JOBPILOT_JWT_SECRET (everyone signs in again)"
            fi

            # 3. Rotate the AT-REST key off the published value — in two variables, not one.
            #
            #    This one cannot be a straight swap. The same key encrypts stored documents AND
            #    the API keys entered in the Admin UI, so replacing it outright makes all of
            #    them unreadable, and AES-GCM's authentication failure surfaces as "the app
            #    forgot my keys" rather than as anything pointing at a key change.
            #
            #    So the OLD key moves to JOBPILOT_DOC_KEY_PREVIOUS (which is what reads rows
            #    not yet migrated) and a strong new key becomes primary. DocumentRekeyService
            #    then re-encrypts each row after startup, verifying every rewrite reads back
            #    before saving it. Only once it reports nothing left may PREVIOUS be removed.
            #
            #    Guarded on the old value specifically: this must run exactly once, and never
            #    against a deployment that already holds a strong key.
            if sudo grep -q '^JOBPILOT_DOC_KEY=change-me-jobpilot-dev-jwt-secret$' "$ENVFILE" \
               && ! sudo grep -q '^JOBPILOT_DOC_KEY_PREVIOUS=' "$ENVFILE"; then
              printf 'JOBPILOT_DOC_KEY_PREVIOUS=%s\n' 'change-me-jobpilot-dev-jwt-secret' | sudo tee -a "$ENVFILE" >/dev/null
              # `|` as the delimiter is safe: base64's alphabet is A-Za-z0-9+/= so the
              # generated key can never contain it, nor the & that sed would expand.
              sudo sed -i "s|^JOBPILOT_DOC_KEY=change-me-jobpilot-dev-jwt-secret$|JOBPILOT_DOC_KEY=$(openssl rand -base64 48)|" "$ENVFILE"
              echo "bootstrap: rotated JOBPILOT_DOC_KEY to a strong key; the old one is retained"
              echo "bootstrap: as JOBPILOT_DOC_KEY_PREVIOUS so the startup re-key can read legacy rows"
            fi
            # ------------------------------------------------------------------------------

            cd ~/jobpilot
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker image prune -f
            echo "Containers: $(sudo docker compose ps --format '{{.Name}} {{.Status}}')"

      # VERIFY BY THE ARTEFACT, NOT THE STATUS.
      #
      # The rollout step above used to be the whole job: it echoed "Up 8 seconds" and reported
      # success on that. Container uptime says a process started, NOT that the application
      # serves — a Spring context that dies on a bad config leaves a container that is
      # technically up while every request 502s. On 2026-09-19 that produced a green deploy
      # over a backend that was down for half an hour.
      #
      # Checked from the RUNNER against the public URL, not from inside the VM against
      # 127.0.0.1:8080. The first attempt did the latter and got connection-refused on a
      # perfectly healthy backend: the VM's compose keeps the backend on the docker network
      # behind Caddy and never publishes 8080 to the host. Hitting the public URL also tests
      # what a user actually touches — Caddy, TLS and routing included.
      - name: Wait for the backend to actually serve
        run: |
          : "${BACKEND_URL:?BACKEND_URL secret is not set on this repository}"
          for i in $(seq 1 36); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "$BACKEND_URL/health" || echo 000)
            echo "[$i] $BACKEND_URL/health -> $code"
            if [ "$code" = "200" ]; then echo "backend is serving"; exit 0; fi
            sleep 5
          done
          echo "::error::backend did not serve /health within 180s of rollout"
          exit 1
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}

      # Only on failure, and only then — the logs are the first thing anyone needs and the
      # last thing anyone can get after the job ends.
      - name: Dump backend logs (only if it never came up)
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 2m
          script: |
            cd ~/jobpilot
            echo "--------------------------- container state ---------------------------"
            sudo docker compose ps
            echo "----------------------------- backend logs ----------------------------"
            sudo docker compose logs --tail 200 backend || sudo docker compose logs --tail 200
