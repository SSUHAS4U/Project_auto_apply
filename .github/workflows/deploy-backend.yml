name: Build & publish backend image

# Builds the Spring Boot backend into a Docker image on GitHub's free runners (the 1 GB
# VM is too small to build it) and publishes it to GitHub Container Registry. The VM then
# just pulls + runs this image. No secrets are baked in — they live in the VM's .env only.

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/ssuhas4u/jobpilot-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # After the new image is published, SSH into the free GCP VM and roll it out.
  # Requires repo secrets: VM_HOST (the VM's external IP), VM_USER, VM_SSH_KEY (private key).
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Roll out on the VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd ~/jobpilot
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker image prune -f
            echo "Containers: $(sudo docker compose ps --format '{{.Name}} {{.Status}}')"

      # VERIFY BY THE ARTEFACT, NOT THE STATUS.
      #
      # The rollout step above used to be the whole job: it echoed "Up 8 seconds" and reported
      # success on that. Container uptime says a process started, NOT that the application
      # serves — a Spring context that dies on a bad config leaves a container that is
      # technically up while every request 502s. On 2026-09-19 that produced a green deploy
      # over a backend that was down for half an hour.
      #
      # Checked from the RUNNER against the public URL, not from inside the VM against
      # 127.0.0.1:8080. The first attempt did the latter and got connection-refused on a
      # perfectly healthy backend: the VM's compose keeps the backend on the docker network
      # behind Caddy and never publishes 8080 to the host. Hitting the public URL also tests
      # what a user actually touches — Caddy, TLS and routing included.
      - name: Wait for the backend to actually serve
        run: |
          : "${BACKEND_URL:?BACKEND_URL secret is not set on this repository}"
          for i in $(seq 1 36); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "$BACKEND_URL/health" || echo 000)
            echo "[$i] $BACKEND_URL/health -> $code"
            if [ "$code" = "200" ]; then echo "backend is serving"; exit 0; fi
            sleep 5
          done
          echo "::error::backend did not serve /health within 180s of rollout"
          exit 1
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}

      # Only on failure, and only then — the logs are the first thing anyone needs and the
      # last thing anyone can get after the job ends.
      - name: Dump backend logs (only if it never came up)
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 2m
          script: |
            cd ~/jobpilot
            echo "--------------------------- container state ---------------------------"
            sudo docker compose ps
            echo "----------------------------- backend logs ----------------------------"
            sudo docker compose logs --tail 200 backend || sudo docker compose logs --tail 200
