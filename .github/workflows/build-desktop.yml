name: Build JobPilot Desktop

# Builds the installable JobPilot desktop app (Electron) and publishes each installer to a
# GitHub Release, so the dashboard's "Download" button (/releases/latest/download/<asset>)
# always points at a real installer.
#
# The installer bundles the built dashboard + the automation worker, so end users just run
# it, sign in, and click Connect in the built-in terminal.
#
# Trigger: push a tag like `desktop-v4` (or run manually from the Actions tab).

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            out: JobPilot-Windows-Setup.exe
          - os: ubuntu-latest
            script: dist:linux
            out: JobPilot-Linux.AppImage
          - os: macos-14
            script: dist:mac
            out: JobPilot-macOS.dmg
    runs-on: ${{ matrix.os }}
    # `fail-fast: false` above is what keeps one platform's failure from cancelling the others,
    # so each still publishes on its own. `continue-on-error` is deliberately NOT set: it made
    # the RUN report success even when all three platforms failed to package, which is how a
    # release shipped with no installers at all and the failure went unnoticed.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1) Build the dashboard the app serves. (The backend URL is injected at runtime by the
      #    Electron shell from desktop.config.json, so no VITE_API_BASE is needed here.)
      - name: Build dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # 2) Worker deps — bundled into the app as resources (Playwright drives system Chrome).
      - name: Install worker deps
        working-directory: worker
        run: npm install --omit=dev

      # 3) Point the app + worker at the production backend (secret, else the committed default).
      - name: Write backend config
        shell: bash
        run: |
          URL="${{ secrets.DESKTOP_BACKEND_URL }}"
          if [ -n "$URL" ]; then
            echo "{ \"backendUrl\": \"$URL\" }" > desktop/desktop.config.json
          fi

      # 4) Build the installer.
      # Stamp the tag into desktop/package.json first, so the worker can print which build it
      # is on its first log line. Guessing whether an installer predates a fix wastes a whole
      # debugging round-trip on both sides.
      # NOTE: the key is `jobpilotBuild`, NOT `build` — in package.json `build` is
      # electron-builder's own configuration block (appId, files, nsis, …). Writing a string
      # there deletes the entire build config and every platform fails to package.
      - name: Stamp the build version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node -e "
            const fs = require('fs'), f = 'desktop/package.json';
            const p = JSON.parse(fs.readFileSync(f, 'utf8'));
            if (typeof p.build !== 'object') { console.error('refusing: package.json build config is missing'); process.exit(1); }
            p.jobpilotBuild = process.argv[1];
            // electron-updater compares SEMVER, not our tag. package.json sat at 1.0.0 for
            // every release, so an installed app could never tell that desktop-v117 was newer
            // than the v103 it was running, and auto-update would be a permanent no-op.
            // desktop-vN becomes 1.0.N, which rises monotonically with the tag.
            const n = /desktop-v(\d+)/.exec(process.argv[1]);
            if (!n) { console.error('refusing: tag is not desktop-vN, cannot derive a version'); process.exit(1); }
            p.version = '1.0.' + n[1];
            fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
            console.log('stamped jobpilotBuild =', p.jobpilotBuild, '| version =', p.version, '| electron-builder config intact:', Object.keys(p.build).join(','));
          " '${{ github.ref_name }}'
      - name: Install desktop deps
        working-directory: desktop
        run: npm install
      # electron-builder downloads Electron + code-sign helpers here, and that fetch fails
      # intermittently (desktop-v79's Windows job died this way with no code change at all).
      # A failed platform leaves `latest` with no installer for it, so retry once before
      # giving up rather than publishing a release with a dead download link.
      - name: Build installer
        shell: bash
        working-directory: desktop
        run: npm run ${{ matrix.script }} || (echo "::warning::installer build failed, retrying once" && sleep 20 && npm run ${{ matrix.script }})

      # Stamp the release version INTO the filename, so a downloaded installer says which
      # version it is (JobPilot-desktop-v78-Windows-Setup.exe). With a fixed name you cannot
      # tell a fresh download from an old one sitting in your Downloads folder.
      # Both names are published: the versioned one for clarity, and the original fixed name so
      # /releases/latest/download/<fixed> keeps working as a stable fallback link.
      - name: Add a versioned copy of the installer
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        working-directory: desktop/dist
        run: |
          set -e
          base='${{ matrix.out }}'                 # e.g. JobPilot-Windows-Setup.exe
          name="${base%.*}"; ext="${base##*.}"     # JobPilot-Windows-Setup | exe
          cp "$base" "JobPilot-${{ github.ref_name }}-${name#JobPilot-}.$ext"
          ls -la

      - name: Publish installers to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: JobPilot ${{ github.ref_name }}
          body: |
            Download the file with **${{ github.ref_name }}** in its name — that's this release.
            Requires Google Chrome installed. Open the app, connect LinkedIn / Indeed once on the
            Connections page, and the automation starts by itself from then on.

            - Windows: unknown-publisher warning → More info → Run anyway
            - Linux: `chmod +x` the AppImage once, then run it
          files: |
            desktop/dist/${{ matrix.out }}
            desktop/dist/JobPilot-${{ github.ref_name }}-*
            desktop/dist/latest*.yml
            desktop/dist/*.blockmap
          make_latest: true
